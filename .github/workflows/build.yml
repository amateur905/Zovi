name: Build Zovi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name zovi --org com.zovi.demo .

      - name: Set minimum Android version to 10 (API 29)
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 29/' android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zovi-android
          path: build/app/outputs/flutter-apk/app-release.apk
